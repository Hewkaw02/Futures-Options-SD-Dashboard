services:
  # ══════ 1. WEB DASHBOARD SERVICE ══════
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futures-options-dashboard
    image: futures-options-dashboard:latest
    ports:
      - "${PORT:-8050}:8000"
    volumes:
      - ./docs:/app/docs
      - ./trading_results:/app/trading_results
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8000", "--directory", "docs"]

  # ══════ 2. BACKGROUND AUTO-UPDATER SERVICE ══════
  updater:
    image: futures-options-dashboard:latest
    container_name: futures-options-updater
    restart: unless-stopped
    volumes:
      - ./docs:/app/docs
      - ./trading_results:/app/trading_results
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - HOURLY_PIPELINE_INTERVAL_SECONDS=${HOURLY_PIPELINE_INTERVAL_SECONDS:-3600}
      - UPDATE_INTERVAL_SECONDS=${UPDATE_INTERVAL_SECONDS:-3600}
      - LIVE_SYNC_INTERVAL=${LIVE_SYNC_INTERVAL:-5}
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    command: ["python", "docker_updater.py"]

  # ══════ 3. ON-DEMAND CLI RUNNER SERVICE ══════
  pipeline:
    image: futures-options-dashboard:latest
    container_name: futures-options-pipeline
    profiles: ["cli"]
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "update_dashboard.py"]
